<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alinhamento</title>

    <style> 
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 400px;
            height: 400px;
            border-collapse: collapse;
        }


        td {
                border: 1px solid black;
                padding: 8px;
                text-align: center;
                vertical-align: middle;
        }

        .numero {
            text-align: right; 
        }
        .esquerda {text-align: left;

        }


    </style>

</head>
<body>

    <h1>GABARITO - TRABALHANDO COM ALINHAMENTO </h1>
    

    <table>
        <tr> 
            <td class="left" >A1 <br> (Esquerda)</br></td>
            <td>B1 <br> (Padrão Centro) </td>
            <td>C1 <br> (Direita) </br> </td>
        </tr>
        <tr class="linha">
            <td>A2 <br>(Topo)</td>
            <td>B2 <br> (Padrão) </br></td>
            <td class="numero">C2 <br>(Baixo)</td>
        </tr>
        <tr>
            <td>A3 <br>Topo </br></td>
            <td>B3 <br>(Baixo)</br> </td>
            <td class="numero">C3 <br>(Padrão)</br></td>
        </tr>
        <tr> 
            <td>A4</td>
            <td class="dado">1000 <br> (Número à direita)</br> </td>
            <td>C4</td>
        </tr>

    </table>
    
</body>
</html>
