<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alinhamento</title>

    <style> 
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 400px;
            height: 400px;
            border-collapse: collapse;
        }


        td {
                border: 1px solid black;
                padding: 8px;
                text-align: center;
                vertical-align: middle;
        }

        .numero {
            text-align: right; 
        }

        .esquerda {
            text-align: left;
            vertical-align: top;
            background-color: bisque;
        }

        .centro {
            text-align: center;
            vertical-align: middle;
        }
        .direita {
            text-align: right;
            vertical-align: top;
        }
        .topo {
            text-align: top;
            vertical-align: top;
        }
        .baixo {
            text-align: center;
            vertical-align: bottom;
        }
        .linha {
            background-color: rgb(59, 59, 71);
        }



    </style>

</head>
<body>

    <h1>GABARITO - TRABALHANDO COM ALINHAMENTO </h1>
    

    <table>
        <tr> 
            <td class="esquerda" >A1 <br> (Esquerda)</br></td>
            <td class="centro">B1 <br> (Padrão Centro) </td>
            <td class="direita">C1 <br> (Direita) </br> </td>
        </tr>
        <tr class="linha">
            <td class="topo">A2 <br>(Topo)</td>
            <td class="centro">B2 <br> (Padrão) </br></td>
            <td class="numero">C2 <br>(Baixo)</td>
        </tr>
        <tr>
            <td class="topo" >A3 <br>Topo </br></td>
            <td class="baixo">B3 <br>(Baixo)</br> </td>
            <td class="numero">C3 <br>(Padrão)</br></td>
        </tr>
        <tr> 
            <td>A4</td>
            <td class="dado">1000 <br> (Número à direita)</br> </td>
            <td>C4</td>
        </tr>

    </table>
    
</body>
</html>
